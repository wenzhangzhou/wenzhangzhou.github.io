# Keeps the free Supabase project (pigcam API) from being paused for inactivity,
# and makes a small commit every ~20 days so GitHub does not disable this schedule (60-day rule).
name: keepalive
on:
  schedule:
    - cron: "17 2 */2 * *"   # every 2 days, 10:17 Beijing time
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping pigcam API (touches the database)
        run: curl -fsS --retry 3 --retry-delay 10 https://vazjdvmvnoypmswqotlz.supabase.co/functions/v1/pigcam/health
      - uses: actions/checkout@v4
      - name: Heartbeat commit (every 10th run)
        run: |
          if [ $(( GITHUB_RUN_NUMBER % 10 )) -ne 0 ] && [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then exit 0; fi
          date -u +%FT%TZ > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "keepalive" || exit 0
          git push
